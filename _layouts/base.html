<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#070b14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }} · {{ site.title }}</title>
  <link rel="icon" href="{{ '/assets/img/HS.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/app.css' | relative_url }}?v=2">
  {% if page.custom_css %}<style>{{ page.custom_css }}</style>{% endif %}
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="cursor-glow" aria-hidden="true"></div>
  <div class="scroll-progress" aria-hidden="true"></div>

  {% include site-nav.html %}

  <main id="main-content">
    {{ content }}
  </main>

  {% include site-footer.html %}

  <div class="command-palette" id="commandPalette" aria-hidden="true">
    <div class="command-backdrop" data-command-close></div>
    <div class="command-panel" role="dialog" aria-modal="true" aria-labelledby="command-title">
      <div class="command-search">
        <span>⌘</span>
        <input id="commandInput" type="search" placeholder="Jump to…" autocomplete="off">
        <kbd>ESC</kbd>
      </div>
      <div class="command-results" id="commandResults"></div>
      <p class="command-hint">Tip: press <kbd>Ctrl</kbd> <span>+</span> <kbd>K</kbd> anytime.</p>
    </div>
  </div>

  <script>window.HS_BASEURL = {{ site.baseurl | jsonify }};</script>
  <script src="{{ '/assets/js/app.js' | relative_url }}?v=2" defer></script>
</body>
</html>
