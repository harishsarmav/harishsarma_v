---
layout: base
---
<article class="post-shell page-shell">
  <div class="post-head reveal">
    <a class="eyebrow-link" href="{{ '/notes/' | relative_url }}">← Notes</a>
    <p class="eyebrow">{{ page.date | date: "%b %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="post-deck">{{ page.description }}</p>{% endif %}
    <div class="post-meta"><span>{{ page.date | date: "%B %-d, %Y" }}</span><span>·</span><span>{{ content | number_of_words }} words</span></div>
  </div>
  <div class="post-content reveal">
    {{ content }}
  </div>
  <div class="post-end reveal">
    <a class="button button-secondary" href="{{ '/notes/' | relative_url }}">Back to notes</a>
    <a class="button button-primary" href="{{ '/' | relative_url }}#contact">Say hello <span>↗</span></a>
  </div>
</article>
